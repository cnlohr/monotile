<!DOCTYPE html>
<html>
<head>
<style>
html,
body {
	height: 100%;
	margin: 0;
}

.maincanvas {
	position: absolute;
	left: 0px;
	top: 0px;
	z-index: -5;
}

</style>
<script>

var fetchsignal;
var canvasCtx;
var canvas;
var maindiv;

var MapW = 0;
var MapH = 0;
var BlockSize = 0;


function ResetStreamReader()
{
	linepl = 0;
}


function ParseStream( s )
{
	console.log( "Parse Stream: " + s );
}


const consume = responseReader => {
	return responseReader.read().then(result => {
		if( result.value )
		{
			ParseStream( result.value );
		}
		else
		{
			console.log( "No result value" );
			fetchsignal.abort();
			//setTimeout( connectForStream, 100 );
		}
		if (result.done)
		{
			// Reconnect.
			console.log( "Reconnecting" );
			//setTimeout( connectForStream, 100 );
			return;
		}
		return consume(responseReader);
	});
}


const wait = ms => new Promise(r => setTimeout(r, ms));



const stream_in = new ReadableStream({
  async start(controller) {
    await wait(1000);
    controller.enqueue('This ');
    await wait(1000);
    controller.enqueue('is ');
    await wait(1000);
    controller.enqueue('a ');
    await wait(1000);
    controller.enqueue('slow ');
    await wait(1000);
    controller.enqueue('request.');
    controller.close();
  },
}).pipeThrough(new TextEncoderStream());

function connectForStream()
{

	if( fetchsignal ) fetchsignal.abort();
	ResetStreamReader();

console.log( "Generating Signal" );
	fetchsignal = new AbortController();
	try
	{
		linepl = 0;
		fetch( "test_federate_in.cgi", {
			method: 'POST',
			body : stream_in,
			headers : {
				"Content-Type": "application/octet-stream",
				//"Content-Type": "text/plain",
				"Transfer-Encoding": "chunked"
			},
			signal : fetchsignal.signal,
			duplex: 'half',
		 } ).then( response => {
			console.log( "Consume" );
			return consume(response.body.getReader());
		} );
	} catch(error) {
		console.log(error);
		//setTimeout( connectForStream, 100 );
	}
}

function sysload()
{
	setTimeout( connectForStream, 100 );
}
</script>
<body onload=sysload()>

</body>
</html>
